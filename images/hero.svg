<!-- Simple SVG hero (scalable and small) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#a5b4fc" />
      <stop offset="1" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="14" fill="#fff" />
  <rect x="32" y="40" width="480" height="280" rx="12" fill="#eef2ff" />
  <rect x="60" y="80" width="420" height="200" rx="8" fill="url(#g)" opacity="0.9" />
  <g transform="translate(520,60)">
    <circle cx="90" cy="90" r="90" fill="#fff3bf" />
    <text x="90" y="100" text-anchor="middle" font-size="48" font-family="Segoe UI, Roboto, Arial" fill="#1f2937">🤖</text>
  </g>
  <text x="64" y="340" font-family="Inter, Arial" font-size="26" fill="#0f172a" font-weight="700">Kids learning with playful visual blocks</text>
</svg>
